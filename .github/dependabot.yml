version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    # Disable version updates, but leave security updates
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/London
    cooldown:
      default-days: 7
      exclude:
        - "ministryofjustice/*"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: helm
    directory: "/helm_deploy/hmpps-manage-custody-mailbox-register"
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/London
    cooldown:
      default-days: 7
    groups:
      helm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:40"
      timezone: Europe/London
